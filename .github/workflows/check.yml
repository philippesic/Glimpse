name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/package-macos.sh
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            cargo_about_sha256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
          - arch: aarch64
            runner: ubuntu-24.04-arm
            cargo_about_sha256: eb4d9ff6ebd2518152a8308729431a04b3836e71d2bd5ead7aea69f91a71162e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev desktop-file-utils
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -p glimpse -p accesskit_atspi_common -p accesskit_consumer -- -D warnings
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked -p glimpse -p accesskit_atspi_common -p accesskit_consumer -p gpui-component
      - name: Install Ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/python" -m pip install ruff==0.17.5
          echo "$RUNNER_TEMP/ruff/bin" >> "$GITHUB_PATH"
      - run: ruff check --isolated --select E4,E7,E9,F,I,UP,B,SIM,EXE packaging/linux scripts/package-linux.py scripts/tests
      - run: ruff format --isolated --check packaging/linux/install.py scripts/package-linux.py scripts/tests
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Install cargo-about
        env:
          ARCH: ${{ matrix.arch }}
          SHA256: ${{ matrix.cargo_about_sha256 }}
        run: |
          cd "$RUNNER_TEMP"
          package="cargo-about-0.9.3-$ARCH-unknown-linux-musl"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/$package.tar.gz"
          printf '%s  %s\n' "$SHA256" "$package.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$package.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$package/cargo-about"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glimpse-linux-${{ matrix.arch }}
          path: build/glimpse-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
