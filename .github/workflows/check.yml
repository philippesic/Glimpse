name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/package-macos.sh
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev desktop-file-utils
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m pip install ruff==0.17.5
      - run: ruff check --isolated --select E4,E7,E9,F,I,UP,B,SIM,EXE packaging/linux scripts/package-linux.py scripts/tests
      - run: ruff format --isolated --check packaging/linux/install.py scripts/package-linux.py scripts/tests
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/package-linux.py
