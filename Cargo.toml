[package]
name = "glimpse"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
rfd = { version = "0.17.2", default-features = false }
tempfile = "3.27"
libc = "0.2"
raw-window-handle = "0.6"
block2 = "0.6"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
two-face = {version="0.5",default-features=false,features=["syntect-fancy"]}
syntect = {version="5.3",default-features=false,features=["parsing","regex-fancy"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "8.2"
unicode-segmentation = "1.12"
pulldown-cmark = { version = "0.13", default-features = false }
egui_commonmark = {version="0.26",default-features=false,features=["pulldown_cmark"]}
image = {version="0.25",default-features=false,features=["png","jpeg","gif","webp"]}

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "=0.27.2"
winit = { version = "0.30.13", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSView", "NSTextView", "NSText", "NSScrollView", "NSTextContainer", "NSLayoutManager", "NSTextStorage", "NSFont", "NSFontDescriptor", "NSParagraphStyle", "NSColor", "NSEvent", "NSResponder", "NSWindow", "NSMenu", "NSMenuItem", "NSRulerView", "NSStringDrawing", "NSGraphics", "NSGraphicsContext", "NSAttributedString", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSAttributedString", "NSNotification", "NSRange", "NSObject", "NSDictionary"] }
