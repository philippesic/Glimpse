[package]
name = "glimpse"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
trash = "5.2"
xattr = "1.6"
async-channel = "2"
tempfile = "3.27"
libc = "0.2"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
two-face = {version="0.5",default-features=false,features=["syntect-fancy"]}
syntect = {version="5.3",default-features=false,features=["parsing","regex-fancy"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "8.2"
unicode-segmentation = "1.12"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSAttributedString", "NSNotification", "NSRange", "NSObject", "NSDictionary"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
gpui-component = { path = "vendor/gpui-component" }

[dev-dependencies]
egui = "0.37.0"
egui_commonmark = {version="0.26",default-features=false,features=["pulldown_cmark"]}
image = {version="0.25",default-features=false,features=["png","jpeg","gif","webp"]}
