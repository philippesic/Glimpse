[package]
name = "pulldown-cmark"
version = "0.13.5"
edition = "2021"
rust-version = "1.71.1"
license = "MIT"
description = "A pull parser for CommonMark"
repository = "https://github.com/pulldown-cmark/pulldown-cmark"

[features]
default = ["html"]
html = ["dep:pulldown-cmark-escape"]
simd = ["pulldown-cmark-escape?/simd"]
serde = ["dep:serde"]

[dependencies]
bitflags = "2"
memchr = "2.5"
pulldown-cmark-escape = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
unicase = "2.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rustbuild)"] }
